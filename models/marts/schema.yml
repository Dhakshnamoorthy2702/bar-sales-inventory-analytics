
version: 2

models:
  - name: dim_drink
    description: "One row per unique drink."
    columns:
      - name: drink_key
        description: "Unique identifier generated for each drink."
        data_tests:
          - not_null
          - unique

      - name: drink_name
        description: "Standardized name of the drink."
        data_tests:
          - not_null

  - name: fct_drink_sales
    description: "Daily sales totals for each drink."
    columns:
      - name: drink_key
        description: "Unique identifier linking sales to a drink."
        data_tests:
          - not_null

      - name: drink_name
        description: "Name of the drink."

      - name: date
        description: "Date of the sales record."
        data_tests:
          - not_null

      - name: total_sold
        description: "Total number of units sold."

      - name: total_sales_revenue
        description: "Total calculated revenue from sales."

      - name: total_cost_of_sold
        description: "Total calculated cost of units sold."

      - name: total_profit
        description: "Total calculated profit."

  - name: int_drink_sales_calculated
    description: "Calculates stock, sales, cost, profit, reconciliation differences, and data quality statuses."
    columns:
      - name: expected_total_stock
        description: "Calculated stock available before sales."

      - name: expected_new_stock
        description: "Calculated stock remaining after sales."

      - name: expected_cost_of_sold
        description: "Calculated cost of sold units."

      - name: expected_sales_revenue
        description: "Calculated revenue from sold units."

      - name: expected_profit
        description: "Calculated profit from sales."

      - name: mismatch_status
        description: "Indicates whether reported and calculated values match."

      - name: data_quality_status
        description: "Indicates whether the sales record passes data quality rules."
        data_tests:
          - accepted_values:
              arguments:
                values: ['valid', 'invalid']

  - name: rpt_reconciliation_mismatches
    description: "Records where reported stock, cost, revenue, or profit do not match calculated values."
    columns:
      - name: drink_name
        description: "Name of the drink being checked."

      - name: date
        description: "Date of the record."

      - name: mismatch_status
        description: "Indicates that the record failed reconciliation."

  - name: mart_daily_bar_performance
    description: "Daily totals for drinks sold, revenue, cost, and profit."
    columns:
      - name: date
        description: "Sales date."

      - name: daily_total_sold
        description: "Total units sold during the day."

      - name: daily_total_revenue
        description: "Total sales revenue during the day."

      - name: daily_total_cost
        description: "Total cost of units sold during the day."

      - name: daily_total_profit
        description: "Total profit during the day."

  - name: mart_drink_performance
    description: "Total sales, revenue, cost, profit, and profit margin for each drink."
    columns:
      - name: drink_key
        description: "Unique identifier for the drink."

      - name: drink_name
        description: "Standardized drink name."

      - name: total_unit_sold
        description: "Total units sold for the drink."

      - name: total_revenue
        description: "Total revenue generated by the drink."

      - name: total_cost
        description: "Total cost of the drink's sales."

      - name: total_profit
        description: "Total profit generated by the drink."

      - name: profit_margin_pct
        description: "Profit as a percentage of revenue."

      - name: avg_units_sold_per_day
        description: "Average units sold per recorded drink-date."

  - name: stg_bar_drinks_sales
    description: "Cleans raw bar sales data, standardizes column names, and converts data types."
    columns:
      - name: drink_name
        description: "Drink name cleaned of surrounding spaces and blank values."

      - name: date
        description: "Sales date converted to DATE type."

      - name: old_stock
        description: "Stock quantity at the start of the period."

      - name: supply
        description: "Additional units supplied."

      - name: sold
        description: "Number of units reported as sold."

      - name: purchased_price
        description: "Purchase price per unit."

      - name: selling_price
        description: "Selling price per unit."

      - name: total_amount_pp
        description: "Reported total purchase cost."

      - name: total_sales_amount
        description: "Reported total sales revenue."

      - name: profit
        description: "Reported profit."
